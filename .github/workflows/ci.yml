name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint and typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Assert the direction contract survived the build
        run: grep -q "3cf70a0a" dist/index.html

      - name: Assert no forbidden claims shipped
        run: |
          if grep -rniE "under NDA|a dozen product teams|token pipeline" dist/; then
            echo "::error::A claim PRODUCT.md forbids reached the build output"
            exit 1
          fi

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npm run test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
