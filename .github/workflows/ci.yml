name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint and typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Assert the direction contract survived the build
        run: grep -q "3cf70a0a" dist/index.html

      - name: Assert no forbidden claims shipped
        run: |
          if grep -rniE "under NDA|a dozen product teams|token pipeline" dist/; then
            echo "::error::A claim PRODUCT.md forbids reached the build output"
            exit 1
          fi

      - name: Assert the phone number never ships
        run: |
          if grep -rn "7850 260 974" dist/ docs/ 2>/dev/null; then
            echo "::error::Alex's phone number reached a published file"
            exit 1
          fi

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npm run test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Hand the verified build to the deploy job rather than rebuilding it.
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        with:
          name: dist
          path: dist/
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare
    needs: verify
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://alexboffey.co.uk
    steps:
      # The secrets context cannot be read in a job-level `if`, so the guard
      # lives here. Without it a repo with no Cloudflare secrets shows a red X
      # on every push, which trains you to ignore the one signal that matters.
      - name: Are the Cloudflare secrets present
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deploy: set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see TODO.md)"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install the pinned wrangler
        if: steps.creds.outputs.ready == 'true'
        run: npm ci

      - name: Fetch the build that passed verification
        if: steps.creds.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
